apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quicktable-data
  labels:
    app.kubernetes.io/name: quicktable
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quicktable
  labels:
    app.kubernetes.io/name: quicktable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quicktable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quicktable
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: quicktable
          image: quicktable:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 16000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 16000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 16000
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quicktable-data
---
apiVersion: v1
kind: Service
metadata:
  name: quicktable
  labels:
    app.kubernetes.io/name: quicktable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quicktable
  ports:
    - name: http
      port: 16000
      targetPort: 16000
      protocol: TCP
