name: quicktable
services:
  table:
    image: ghcr.io/thedevtop/quicktable:latest
    command: ["/usr/local/bin/quicktable", "-t", "SECRET-TOKEN-HERE"]
    pull_policy: always
    volumes:
      - quicktable_data:/data
    restart: always
  view:
    image: ghcr.io/thedevtop/quickview:latest
    pull_policy: always
    environment:
      - QUICKTABLE_URL=http://table:16000
    restart: always

volumes:
  quicktable_data:
